<!doctype html>
<!--
  PANEL DEL DOCENTE
  Sin sesión de administrador no se ve nada: exigirAdmin() manda al login.
  Pestañas: Proyectos · Carreras · Ajustes · Métricas (se completan en las partes 3 a 7 de la Fase 5/6).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../img/icono.svg" type="image/svg+xml">
  <title>Panel · Vitrina Digital Ecotec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0662AE">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-panel verificando">
  <!-- Mientras se revisa la sesión solo se ve esto -->
  <p class="verificando-texto" id="verificando" role="status">Revisando tu sesión…</p>

  <header class="panel-cabecera">
    <div class="panel-cabecera-fila">
      <img src="../img/logo-ecotec-blanco.svg" alt="Universidad Ecotec" width="104" height="28">
      <div class="panel-usuario">
        <span class="panel-correo" id="correo-admin"></span>
        <a class="boton-panel claro" href="../index.html" target="_blank" rel="noopener">Ver la vitrina ↗</a>
        <button class="boton-panel claro" type="button" id="salir">Cerrar sesión</button>
      </div>
    </div>
    <h1>Panel del docente</h1>
    <nav class="pestanas" role="tablist" aria-label="Secciones del panel">
      <button role="tab" type="button" id="tab-proyectos" aria-controls="seccion-proyectos" aria-selected="true">Proyectos</button>
      <button role="tab" type="button" id="tab-carreras" aria-controls="seccion-carreras" aria-selected="false" tabindex="-1">Carreras</button>
      <button role="tab" type="button" id="tab-ajustes" aria-controls="seccion-ajustes" aria-selected="false" tabindex="-1">Ajustes</button>
      <button role="tab" type="button" id="tab-metricas" aria-controls="seccion-metricas" aria-selected="false" tabindex="-1">Métricas</button>
    </nav>
  </header>

  <main class="panel-cuerpo">
    <section class="tarjeta-panel resumen" aria-label="Estado de la conexión">
      <p class="resumen-estado" id="resumen" role="status">Conectando…</p>
    </section>

    <section class="seccion" id="seccion-proyectos" role="tabpanel" aria-labelledby="tab-proyectos"><p class="pendiente">Cargando…</p></section>
    <section class="seccion" id="seccion-carreras" role="tabpanel" aria-labelledby="tab-carreras" hidden></section>
    <section class="seccion" id="seccion-ajustes" role="tabpanel" aria-labelledby="tab-ajustes" hidden></section>
    <section class="seccion" id="seccion-metricas" role="tabpanel" aria-labelledby="tab-metricas" hidden>
      <h2>Métricas</h2>
      <p class="pendiente">Visitas, KPIs y exportar CSV (parte 7).</p>
    </section>
  </main>

  <script type="module">
    import { exigirAdmin, cerrarSesion } from './js/sesion.js';
    import { estado, cargarTodo } from './js/datos-panel.js';
    import { iniciarProyectos, hayCambiosSinGuardar } from './js/proyectos.js';
    import { iniciarCarreras } from './js/carreras.js';
    import { iniciarAjustes } from './js/ajustes.js';
    import { confirmar } from './js/util.js';

    const $ = (id) => document.getElementById(id);
    const plural = (n, palabra) => `${n} ${palabra}${n === 1 ? '' : 's'}`;
    const sesion = await exigirAdmin();          // sin sesión de admin, la página no pasa de aquí
    document.body.classList.remove('verificando');
    $('verificando').hidden = true;
    $('correo-admin').textContent = sesion.user.email;
    $('salir').addEventListener('click', async () => {
      if (hayCambiosSinGuardar() && !await confirmar({ titulo: '¿Cerrar sesión sin guardar?', texto: 'Los cambios del proyecto que estás editando se perderán.', boton: 'Cerrar sesión', peligro: true })) return;
      cerrarSesion();
    });

    // ---------- Pestañas (también con flechas del teclado; se recuerda en la dirección: #metricas) ----------
    // Cada pestaña se vuelve a dibujar al abrirla, con los datos al día.
    const dibujar = {
      'tab-proyectos': () => iniciarProyectos($('seccion-proyectos')),
      'tab-carreras': () => iniciarCarreras($('seccion-carreras')),
      'tab-ajustes': () => iniciarAjustes($('seccion-ajustes'))
    };
    const pestanas = [...document.querySelectorAll('[role="tab"]')];
    let actual = $('tab-proyectos');
    async function abrir(pestana, enfocar = false) {
      if (pestana === actual) return;
      if (hayCambiosSinGuardar() && !await confirmar({ titulo: '¿Salir sin guardar?', texto: 'Los cambios del proyecto que estás editando se perderán.', boton: 'Salir sin guardar', peligro: true })) return;
      actual = pestana;
      pestanas.forEach(p => {
        const activa = p === pestana;
        p.setAttribute('aria-selected', String(activa));
        p.tabIndex = activa ? 0 : -1;
        $(p.getAttribute('aria-controls')).hidden = !activa;
      });
      dibujar[pestana.id]?.();
      if (enfocar) pestana.focus();
      history.replaceState(null, '', `#${pestana.id.replace('tab-', '')}`);
    }
    pestanas.forEach((p, i) => {
      p.addEventListener('click', () => abrir(p));
      p.addEventListener('keydown', (e) => {
        const salto = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
        if (salto) abrir(pestanas[(i + salto + pestanas.length) % pestanas.length], true);
      });
    });

    // ---------- Datos y resumen (se actualiza con cada cambio guardado) ----------
    function resumen() {
      const publicados = estado.proyectos.filter(p => p.publicado).length;
      const ultimo = estado.proyectos.map(p => p.actualizado).sort().at(-1);
      $('resumen').innerHTML = '<strong class="estado-conexion ok">Conectado</strong>';
      $('resumen').append(` · ${plural(estado.proyectos.length, 'proyecto')} (${plural(publicados, 'publicado')})` +
        (ultimo ? ` · último cambio: ${new Date(ultimo).toLocaleString('es-EC', { dateStyle: 'medium', timeStyle: 'short' })}` : ''));
    }
    try {
      await cargarTodo();
      resumen();
      document.addEventListener('panel:cambio', resumen);
      dibujar['tab-proyectos']();
      const inicial = $(`tab-${location.hash.slice(1)}`);
      if (inicial) abrir(inicial);
    } catch (error) {
      console.error(error);
      $('resumen').innerHTML = '<strong class="estado-conexion error">Sin conexión</strong> · No se pudieron leer los proyectos. Revisa tu internet o si Supabase está pausado.';
      $('seccion-proyectos').innerHTML = '<p class="pendiente">No se pudo cargar el contenido. Recarga la página en un momento.</p>';
    }
  </script>
</body>
</html>
